<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake by Adlai Dyson</title>
    <meta name="description" content="Play my photography themed snake game, free to play online.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snake">
    <meta name="application-name" content="Snake">
    <meta name="theme-color" content="#4CAF50">
    <link rel="icon" href="https://raw.githubusercontent.com/adlaidyson-ffp/FFPMisc2/refs/heads/main/SnakeLogoFavicon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/adlaidyson-ffp/FFPMisc2/refs/heads/main/SnakeLogoFavicon.jpg">
    <style>
        /* Aptos Font (or fallback) */
        @import url('https://fonts.googleapis.com/css2?family=Aptos&display=swap');

        :root {
            --background-color: #1e374d;
            --text-color: #94fdf8;
            --snake-color: #94fdf8;
            --snake-head-color: #a4fffa;
            --tongue-color: #ff5555;
            --overlay-bg: rgba(30, 55, 77, 0.85);
            --grid-color-1: #112233; /* Darker grid square */
            --grid-color-2: #15283a; /* Lighter grid square */
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Aptos', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            /* Prevents scroll chaining on mobile */
            overscroll-behavior-y: contain;
        }
        
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
        }

        .ui-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 0 1rem;
        }

        .score-display, .highscore-display {
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .game-container {
            position: relative;
            width: 100%;
            /* Aspect ratio 4:3 for a nice game view */
            aspect-ratio: 4 / 3;
            max-height: 75vh;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background-color: var(--grid-color-1);
            touch-action: none; /* Disables browser handling of touch actions like pinch-zoom */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 1rem;
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 1rem;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            opacity: 0;
            visibility: hidden;
            z-index: 10;
        }

        .modal.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal h2 {
            font-size: 3rem;
            margin: 0;
            font-weight: bold;
        }

        .modal p {
            font-size: 1.2rem;
            margin: 0.5rem 0 1.5rem 0;
        }

        .modal button {
            background-color: var(--text-color);
            color: var(--background-color);
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(148, 253, 248, 0.2);
        }

        .modal button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(148, 253, 248, 0.3);
        }

        .info-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        
        .info-buttons {
            display: flex;
            gap: 1rem;
            width: 100%;
            justify-content: center;
        }

        .info-buttons a {
            color: var(--text-color);
            text-decoration: none;
            background: var(--grid-color-1);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: bold;
            transition: background 0.2s ease;
            flex: 1; /* Makes buttons equal width */
        }
        
        .info-buttons a:hover {
            background: #2a4a65;
        }

        .info-panel .logo-link img {
            max-width: 200px; /* Reduced logo size */
            height: auto;
            margin-top: 0.5rem;
        }
        
        .info-panel .credit-link {
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }
        
        .info-panel .credit-link:hover {
            opacity: 1;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            body {
                padding: 0.5rem;
            }
            .main-wrapper {
                gap: 1rem;
            }
            .ui-header {
                font-size: 1.2rem;
                padding: 0 0.5rem;
            }
            .modal h2 {
                font-size: 2.5rem;
            }
            .modal p {
                font-size: 1rem;
            }
            .modal button {
                padding: 0.7rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="ui-header">
            <div class="score-display">Score: <span id="score">0</span></div>
            <div class="highscore-display">High Score: <span id="high-score">0</span></div>
        </div>
        
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            <div id="start-modal" class="modal visible">
                <h2>Snake</h2>
                <p>Use Arrow Keys, WASD, or Swipe to play!</p>
                <button id="start-button">Start Game</button>
            </div>
            <div id="game-over-modal" class="modal">
                <h2 id="game-over-title">Game Over</h2>
                <p>Your score: <span id="final-score">0</span></p>
                <button id="restart-button">Play Again</button>
            </div>
        </div>
        
        <div class="info-panel">
            <div class="info-buttons">
                <a href="https://redirect.adlaidyson.co.uk/aboutsnake" target="_blank" rel="noopener noreferrer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zM5.496 6.033h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286a.237.237 0 0 0 .241.247zm2.325 6.443c.61 0 1.029-.394 1.029-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94 0 .533.425.927 1.01.927z"/>
                    </svg>
                    Learn more
                </a>
                <a href="https://github.com/adlaidyson-ffp/Snake-Game" target="_blank" rel="noopener noreferrer">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" width="20" height="20"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                    View on GitHub
                </a>
            </div>
             <a href="https://adlaidyson.co.uk" target="_blank" rel="noopener noreferrer" class="logo-link">
                <img src="https://raw.githubusercontent.com/adlaidyson-ffp/FFP-Online-Misc/refs/heads/New-Logos/FFP-NewLogo-Light-Banner-Transparent.png" alt="Your Logo">
            </a>
            <a href="https://adlaidyson.co.uk" target="_blank" rel="noopener noreferrer" class="credit-link">
                Made by Adlai Dyson | Fused Frame Photography
            </a>
        </div>
    </div>

    <script>
    window.addEventListener('load', () => {
        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const startModal = document.getElementById('start-modal');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreEl = document.getElementById('final-score');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');

        // --- Game Configuration ---
        const FOOD_EMOJIS = ['📸', '💡', '📱', '💻', '🎥', '📷'];
        const INITIAL_SNAKE_LENGTH = 5;
        const INITIAL_GRID_COLS = 20;
        const GAME_SPEED = 125; // Milliseconds per frame update

        // --- Game State ---
        let gridSize;
        let snake;
        let food;
        let direction;
        let score;
        let highScore;
        let changingDirection;
        let gameStarted = false;
        let gameOver = false;
        let gameLoopTimeout;
        let tongueOut = false;
        let tongueCounter = 0;

        // --- Touch Controls State ---
        let touchStartX = 0;
        let touchStartY = 0;

        // --- Game Initialization ---
        function init(startDirection = null) {
            gameOver = false;
            gameStarted = true;
            changingDirection = false;
            direction = startDirection || { x: 1, y: 0 };
            score = 0;
            
            setupCanvas();
            updateGrid(INITIAL_GRID_COLS);
            
            snake = [];
            const startX = Math.floor(gridSize.cols / 2);
            const startY = Math.floor(gridSize.rows / 2);
            for (let i = 0; i < INITIAL_SNAKE_LENGTH; i++) {
                snake.push({ x: startX - i, y: startY });
            }

            highScore = localStorage.getItem('snakeHighScore') || 0;
            updateScoreDisplay();
            generateFood();
            
            startModal.classList.remove('visible');
            gameOverModal.classList.remove('visible');

            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            main();
        }

        // --- Main Game Loop ---
        function main() {
            if (gameOver) {
                showGameOver();
                return;
            }
            gameLoopTimeout = setTimeout(() => {
                changingDirection = false;
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, GAME_SPEED);
        }

        // --- Canvas and Drawing ---
        function setupCanvas() {
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            ctx.scale(dpr, dpr);
        }
        
        function updateGrid(newCols) {
            const rect = canvas.getBoundingClientRect();
            const logicalWidth = rect.width;
            const logicalHeight = rect.height;

            gridSize = {
                cols: newCols,
                rows: Math.round(newCols * (logicalHeight / logicalWidth)),
                tileSize: logicalWidth / newCols,
            };
        }

        function clearCanvas() {
            const color1 = getComputedStyle(document.documentElement).getPropertyValue('--grid-color-1').trim();
            const color2 = getComputedStyle(document.documentElement).getPropertyValue('--grid-color-2').trim();

            for (let row = 0; row < gridSize.rows; row++) {
                for (let col = 0; col < gridSize.cols; col++) {
                    if ((row + col) % 2 === 0) {
                        ctx.fillStyle = color1;
                    } else {
                        ctx.fillStyle = color2;
                    }
                    ctx.fillRect(col * gridSize.tileSize, row * gridSize.tileSize, gridSize.tileSize, gridSize.tileSize);
                }
            }
        }

        function drawSnake() {
            tongueCounter++;
            if (tongueCounter > 20) {
                tongueOut = !tongueOut;
                tongueCounter = 0;
            }
            snake.forEach((segment, index) => {
                const color = index === 0 ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head-color').trim() : getComputedStyle(document.documentElement).getPropertyValue('--snake-color').trim();
                drawSnakePart(segment, color);
                if (index === 0) {
                    drawEyes(segment);
                    if (tongueOut) drawTongue(segment);
                }
            });
        }

        function drawSnakePart(segment, color) {
            const { tileSize } = gridSize;
            const x = segment.x * tileSize;
            const y = segment.y * tileSize;
            const radius = tileSize / 2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x + radius, y + radius, radius * 0.95, 0, 2 * Math.PI); // Slightly smaller to show gaps
            ctx.fill();
        }
        
        function drawEyes(head) {
            const { tileSize } = gridSize;
            const eyeRadius = tileSize * 0.1;
            const headCenterX = head.x * tileSize + tileSize / 2;
            const headCenterY = head.y * tileSize + tileSize / 2;
            ctx.fillStyle = '#112233';
            ctx.beginPath();
            if (direction.x !== 0) { // Moving horizontally
                ctx.arc(headCenterX, headCenterY - tileSize * 0.25, eyeRadius, 0, 2 * Math.PI);
                ctx.arc(headCenterX, headCenterY + tileSize * 0.25, eyeRadius, 0, 2 * Math.PI);
            } else { // Moving vertically
                ctx.arc(headCenterX - tileSize * 0.25, headCenterY, eyeRadius, 0, 2 * Math.PI);
                ctx.arc(headCenterX + tileSize * 0.25, headCenterY, eyeRadius, 0, 2 * Math.PI);
            }
            ctx.fill();
        }

        function drawTongue(head) {
            const { tileSize } = gridSize;
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--tongue-color').trim();
            ctx.lineWidth = Math.max(1, tileSize * 0.08);
            const startX = head.x * tileSize + tileSize / 2;
            const startY = head.y * tileSize + tileSize / 2;
            const endX = startX + direction.x * tileSize * 0.6;
            const endY = startY + direction.y * tileSize * 0.6;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
        }

        function drawFood() {
            const { tileSize } = gridSize;
            ctx.font = `${tileSize * 0.9}px sans-serif`; // Larger emoji
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(food.emoji, food.x * tileSize + tileSize / 2, food.y * tileSize + tileSize / 2);
        }

        // --- Game Logic ---
        function moveSnake() {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            snake.unshift(head);
            if (hasGameEnded()) {
                gameOver = true;
                return;
            }
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                updateScoreDisplay();
                checkAndResizeGrid();
                generateFood();
            } else {
                snake.pop();
            }
        }
        
        function checkAndResizeGrid() {
            const len = snake.length;
            let newCols = gridSize.cols;
            if (len >= 40 && gridSize.cols < 35) newCols = 35;
            else if (len >= 25 && gridSize.cols < 30) newCols = 30;
            else if (len >= 15 && gridSize.cols < 25) newCols = 25;
            
            if (newCols !== gridSize.cols) {
                updateGrid(newCols);
            }
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= gridSize.cols || snake[0].y < 0 || snake[0].y >= gridSize.rows;
        }

        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * gridSize.cols),
                    y: Math.floor(Math.random() * gridSize.rows),
                    emoji: FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)]
                };
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function updateScoreDisplay() {
            scoreEl.textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }
            highScoreEl.textContent = highScore;
        }
        
        function showGameOver() {
            finalScoreEl.textContent = score;
            gameOverModal.classList.add('visible');
        }

        // --- Input Handling ---
        function handleDirectionChange(newDirection) {
            if (gameStarted) {
                if (changingDirection) return;
                const goingUp = direction.y === -1, goingDown = direction.y === 1;
                const goingRight = direction.x === 1, goingLeft = direction.x === -1;
                let isValidMove = false;
                if (newDirection === 'UP' && !goingDown) { direction = { x: 0, y: -1 }; isValidMove = true; }
                else if (newDirection === 'DOWN' && !goingUp) { direction = { x: 0, y: 1 }; isValidMove = true; }
                else if (newDirection === 'LEFT' && !goingRight) { direction = { x: -1, y: 0 }; isValidMove = true; }
                else if (newDirection === 'RIGHT' && !goingLeft) { direction = { x: 1, y: 0 }; isValidMove = true; }
                if (isValidMove) changingDirection = true;
            } else {
                let startDirection = null;
                if (newDirection === 'UP') startDirection = { x: 0, y: -1 };
                else if (newDirection === 'DOWN') startDirection = { x: 0, y: 1 };
                else if (newDirection === 'LEFT') startDirection = { x: -1, y: 0 };
                else if (newDirection === 'RIGHT') startDirection = { x: 1, y: 0 };
                if (startDirection) init(startDirection);
            }
        }

        function handleKeyDown(event) {
            const key = event.key.toLowerCase();
            if (key === "arrowup" || key === "w") handleDirectionChange('UP');
            else if (key === "arrowdown" || key === "s") handleDirectionChange('DOWN');
            else if (key === "arrowleft" || key === "a") handleDirectionChange('LEFT');
            else if (key === "arrowright" || key === "d") handleDirectionChange('RIGHT');
        }

        function handleTouchStart(event) {
            event.preventDefault(); // Prevents page scroll
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }

        function handleTouchEnd(event) {
            event.preventDefault(); // Prevents page scroll
            const touchEndX = event.changedTouches[0].screenX;
            const touchEndY = event.changedTouches[0].screenY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) handleDirectionChange('RIGHT');
                else if (dx < -30) handleDirectionChange('LEFT');
            } else {
                if (dy > 30) handleDirectionChange('DOWN');
                else if (dy < -30) handleDirectionChange('UP');
            }
        }

        // --- Event Listeners ---
        document.addEventListener("keydown", handleKeyDown);
        startButton.addEventListener('click', () => init());
        restartButton.addEventListener('click', () => init());
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        
        const resizeObserver = new ResizeObserver(() => {
            if (!gameStarted) {
                setupCanvas();
            }
        });
        resizeObserver.observe(canvas.parentElement);

        // --- Initial Setup on Load and PWA Registration ---
        // Note: The PWA registration code is placed here for best practice.
        // It's inside the main event listener to ensure everything is loaded.
        setupCanvas();
        highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreEl.textContent = highScore;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('Service Worker registered: ', registration);
                })
                .catch(err => {
                    console.log('Service Worker registration failed: ', err);
                });
        }
    });
</script>

</body>
