<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        /* Aptos Font (or fallback) */
        @import url('https://fonts.googleapis.com/css2?family=Aptos&display=swap');

        :root {
            --background-color: #1e374d;
            --text-color: #94fdf8;
            --snake-color: #94fdf8;
            --snake-head-color: #a4fffa;
            --tongue-color: #ff5555;
            --overlay-bg: rgba(30, 55, 77, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Aptos', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        .game-container {
            position: relative;
            width: 90vw;
            height: 75vh;
            max-width: 800px;
            max-height: 600px;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background-color: #112233; /* Slightly darker than body for contrast */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 1rem;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none; /* Allows clicks/touches to pass through to the canvas */
        }
        
        .score-display, .highscore-display {
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 1rem;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            opacity: 0;
            visibility: hidden;
        }

        .modal.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal h2 {
            font-size: 3rem;
            margin: 0;
            font-weight: bold;
        }

        .modal p {
            font-size: 1.2rem;
            margin: 0.5rem 0 1.5rem 0;
        }

        .modal button {
            background-color: var(--text-color);
            color: var(--background-color);
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(148, 253, 248, 0.2);
        }

        .modal button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(148, 253, 248, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .game-container {
                width: 100vw;
                height: 80vh;
                border-radius: 0;
            }
            .ui-overlay {
                font-size: 1.2rem;
                padding: 0.5rem 1rem;
            }
            .modal h2 {
                font-size: 2.5rem;
            }
            .modal p {
                font-size: 1rem;
            }
            .modal button {
                padding: 0.7rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="ui-overlay">
            <div class="score-display">Score: <span id="score">0</span></div>
            <div class="highscore-display">High Score: <span id="high-score">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="start-modal" class="modal visible">
            <h2>Snake</h2>
            <p>Use Arrow Keys, WASD, or Swipe to play.</p>
            <button id="start-button">Start Game</button>
        </div>
        <div id="game-over-modal" class="modal">
            <h2 id="game-over-title">Game Over</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <button id="restart-button">Play Again</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('score');
            const highScoreEl = document.getElementById('high-score');
            const startModal = document.getElementById('start-modal');
            const gameOverModal = document.getElementById('game-over-modal');
            const finalScoreEl = document.getElementById('final-score');
            const startButton = document.getElementById('start-button');
            const restartButton = document.getElementById('restart-button');

            // --- Game Configuration ---
            const FOOD_EMOJIS = ['📸', '💡', '📱', '💻', '🎥', '📷'];
            const INITIAL_SNAKE_LENGTH = 5;
            const GAME_SPEED = 125; // Milliseconds per frame update

            // --- Game State ---
            let gridSize;
            let snake;
            let food;
            let direction;
            let score;
            let highScore;
            let changingDirection;
            let gameStarted = false;
            let gameOver = false;
            let gameLoopTimeout;
            let tongueOut = false;
            let tongueCounter = 0;

            // --- Touch Controls State ---
            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;

            // --- Game Initialization ---
            function init() {
                // Reset game state
                gameOver = false;
                gameStarted = true;
                changingDirection = false;
                direction = { x: 1, y: 0 }; // Start moving right
                score = 0;
                
                // Set canvas size based on container
                resizeCanvas();
                
                // Initialize snake in the center
                snake = [];
                const startX = Math.floor(gridSize.cols / 2);
                const startY = Math.floor(gridSize.rows / 2);
                for (let i = 0; i < INITIAL_SNAKE_LENGTH; i++) {
                    snake.push({ x: startX - i, y: startY });
                }

                // Load high score from local storage
                highScore = localStorage.getItem('snakeHighScore') || 0;
                updateScoreDisplay();

                // Place first food
                generateFood();
                
                // Hide modals
                startModal.classList.remove('visible');
                gameOverModal.classList.remove('visible');

                // Start the game loop
                if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
                main();
            }

            // --- Main Game Loop ---
            function main() {
                if (gameOver) {
                    showGameOver();
                    return;
                }

                gameLoopTimeout = setTimeout(() => {
                    changingDirection = false;
                    clearCanvas();
                    drawFood();
                    moveSnake();
                    drawSnake();
                    // Request the next frame
                    main();
                }, GAME_SPEED);
            }

            // --- Canvas and Drawing ---
            function resizeCanvas() {
                const container = canvas.parentElement;
                const size = Math.min(container.clientWidth, container.clientHeight);
                
                // To avoid blurry rendering on high-DPI screens
                const dpr = window.devicePixelRatio || 1;
                canvas.width = size * dpr;
                canvas.height = size * dpr;
                canvas.style.width = `${size}px`;
                canvas.style.height = `${size}px`;
                ctx.scale(dpr, dpr);
                
                // Determine grid size based on canvas dimensions
                const baseTileSize = 20;
                const cols = Math.floor(size / baseTileSize);
                gridSize = {
                    cols: cols,
                    rows: Math.floor(size / baseTileSize),
                    tileSize: size / cols,
                };
            }
            
            function clearCanvas() {
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--background-color').trim();
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            function drawSnake() {
                // Tongue logic
                tongueCounter++;
                if (tongueCounter > 20) { // Toggle every ~2.5 seconds
                    tongueOut = !tongueOut;
                    tongueCounter = 0;
                }

                snake.forEach((segment, index) => {
                    if (index === 0) {
                        // Head
                        drawSnakePart(segment, getComputedStyle(document.documentElement).getPropertyValue('--snake-head-color').trim());
                        drawEyes(segment);
                        if (tongueOut) {
                           drawTongue(segment);
                        }
                    } else {
                        // Body
                        drawSnakePart(segment, getComputedStyle(document.documentElement).getPropertyValue('--snake-color').trim());
                    }
                });
            }

            function drawSnakePart(segment, color) {
                const { tileSize } = gridSize;
                const x = segment.x * tileSize;
                const y = segment.y * tileSize;
                const radius = tileSize / 2;

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x + radius, y + radius, radius, 0, 2 * Math.PI);
                ctx.fill();
            }
            
            function drawEyes(head) {
                const { tileSize } = gridSize;
                const eyeRadius = tileSize * 0.1;
                const eyeOffsetX = tileSize * 0.25;
                const eyeOffsetY = tileSize * 0.25;

                ctx.fillStyle = '#112233';
                ctx.beginPath();
                
                // Calculate eye positions based on direction
                if (direction.x === 1) { // Right
                    ctx.arc(head.x * tileSize + tileSize / 2, head.y * tileSize + eyeOffsetY, eyeRadius, 0, 2 * Math.PI);
                    ctx.arc(head.x * tileSize + tileSize / 2, head.y * tileSize + tileSize - eyeOffsetY, eyeRadius, 0, 2 * Math.PI);
                } else if (direction.x === -1) { // Left
                    ctx.arc(head.x * tileSize + tileSize / 2, head.y * tileSize + eyeOffsetY, eyeRadius, 0, 2 * Math.PI);
                    ctx.arc(head.x * tileSize + tileSize / 2, head.y * tileSize + tileSize - eyeOffsetY, eyeRadius, 0, 2 * Math.PI);
                } else if (direction.y === 1) { // Down
                    ctx.arc(head.x * tileSize + eyeOffsetX, head.y * tileSize + tileSize / 2, eyeRadius, 0, 2 * Math.PI);
                    ctx.arc(head.x * tileSize + tileSize - eyeOffsetX, head.y * tileSize + tileSize / 2, eyeRadius, 0, 2 * Math.PI);
                } else if (direction.y === -1) { // Up
                    ctx.arc(head.x * tileSize + eyeOffsetX, head.y * tileSize + tileSize / 2, eyeRadius, 0, 2 * Math.PI);
                    ctx.arc(head.x * tileSize + tileSize - eyeOffsetX, head.y * tileSize + tileSize / 2, eyeRadius, 0, 2 * Math.PI);
                }
                ctx.fill();
            }

            function drawTongue(head) {
                const { tileSize } = gridSize;
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--tongue-color').trim();
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--tongue-color').trim();
                ctx.lineWidth = tileSize * 0.05;

                const startX = head.x * tileSize + tileSize / 2;
                const startY = head.y * tileSize + tileSize / 2;
                const endX = startX + direction.x * tileSize * 0.6;
                const endY = startY + direction.y * tileSize * 0.6;

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }

            function drawFood() {
                const { tileSize } = gridSize;
                ctx.font = `${tileSize * 0.8}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(food.emoji, food.x * tileSize + tileSize / 2, food.y * tileSize + tileSize / 2);
            }


            // --- Game Logic ---
            function moveSnake() {
                const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
                snake.unshift(head);

                // Check for collision
                if (hasGameEnded()) {
                    gameOver = true;
                    return;
                }

                // Check for food
                const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
                if (hasEatenFood) {
                    score += 10;
                    updateScoreDisplay();
                    generateFood();
                } else {
                    snake.pop();
                }
            }
            
            function hasGameEnded() {
                // Check self collision
                for (let i = 4; i < snake.length; i++) {
                    if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
                        return true;
                    }
                }
                // Check wall collision
                const hitLeftWall = snake[0].x < 0;
                const hitRightWall = snake[0].x >= gridSize.cols;
                const hitTopWall = snake[0].y < 0;
                const hitBottomWall = snake[0].y >= gridSize.rows;
                return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
            }

            function generateFood() {
                let newFoodPosition;
                do {
                    newFoodPosition = {
                        x: Math.floor(Math.random() * gridSize.cols),
                        y: Math.floor(Math.random() * gridSize.rows)
                    };
                } while (isFoodOnSnake(newFoodPosition));

                food = {
                    ...newFoodPosition,
                    emoji: FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)]
                };
            }

            function isFoodOnSnake(position) {
                return snake.some(segment => segment.x === position.x && segment.y === position.y);
            }

            function updateScoreDisplay() {
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                highScoreEl.textContent = highScore;
            }
            
            function showGameOver() {
                finalScoreEl.textContent = score;
                gameOverModal.classList.add('visible');
            }

            // --- Input Handling ---
            function changeDirection(event) {
                if (changingDirection) return;
                changingDirection = true;

                const keyPressed = event.key;
                const goingUp = direction.y === -1;
                const goingDown = direction.y === 1;
                const goingRight = direction.x === 1;
                const goingLeft = direction.x === -1;

                if ((keyPressed === "ArrowUp" || keyPressed.toLowerCase() === "w") && !goingDown) {
                    direction = { x: 0, y: -1 };
                } else if ((keyPressed === "ArrowDown" || keyPressed.toLowerCase() === "s") && !goingUp) {
                    direction = { x: 0, y: 1 };
                } else if ((keyPressed === "ArrowLeft" || keyPressed.toLowerCase() === "a") && !goingRight) {
                    direction = { x: -1, y: 0 };
                } else if ((keyPressed === "ArrowRight" || keyPressed.toLowerCase() === "d") && !goingLeft) {
                    direction = { x: 1, y: 0 };
                } else {
                    // If an invalid key is pressed, allow another direction change immediately
                    changingDirection = false;
                }

                // Start game on first valid keypress if not already started
                if (!gameStarted && !gameOver) {
                    init();
                }
            }

            function handleTouchStart(event) {
                touchStartX = event.changedTouches[0].screenX;
                touchStartY = event.changedTouches[0].screenY;
            }

            function handleTouchEnd(event) {
                touchEndX = event.changedTouches[0].screenX;
                touchEndY = event.changedTouches[0].screenY;
                handleSwipe();
            }

            function handleSwipe() {
                if (changingDirection) return;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);

                // Only register swipe if it's significant
                if (Math.max(absDx, absDy) < 30) return;

                changingDirection = true;
                
                const goingUp = direction.y === -1;
                const goingDown = direction.y === 1;
                const goingRight = direction.x === 1;
                const goingLeft = direction.x === -1;

                if (absDx > absDy) { // Horizontal swipe
                    if (dx > 0 && !goingLeft) direction = { x: 1, y: 0 }; // Right
                    else if (dx < 0 && !goingRight) direction = { x: -1, y: 0 }; // Left
                } else { // Vertical swipe
                    if (dy > 0 && !goingUp) direction = { x: 0, y: 1 }; // Down
                    else if (dy < 0 && !goingDown) direction = { x: 0, y: -1 }; // Up
                }

                if (!gameStarted && !gameOver) {
                    init();
                }
            }

            // --- Event Listeners ---
            document.addEventListener("keydown", changeDirection);
            startButton.addEventListener('click', init);
            restartButton.addEventListener('click', init);
            window.addEventListener('resize', () => {
                if(!gameStarted) {
                    resizeCanvas();
                }
            });
            
            // Touch Controls
            canvas.addEventListener('touchstart', handleTouchStart, false);
            canvas.addEventListener('touchend', handleTouchEnd, false);

            // --- Initial Setup on Load ---
            resizeCanvas();
            highScore = localStorage.getItem('snakeHighScore') || 0;
            highScoreEl.textContent = highScore;
        });
    </script>

</body>
</html>
